name: ci

on:
  push:
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate isolated synthetic pilot configuration
        run: |
          pip install cryptography
          python scripts/prepare-validation.py --domain pilot.example.com --review CI-SYNTHETIC-VALIDATION
          docker compose --env-file .env.validation -f infra/docker-compose.validation.yml config -q
      - name: Build and start controlled validation services
        run: docker compose --env-file .env.validation -f infra/docker-compose.validation.yml up -d --build --wait api worker web
      - name: Verify API and worker preflight, optimized web and private signup
        run: |
          docker compose --env-file .env.validation -f infra/docker-compose.validation.yml exec -T api python -m app.deployment --check-db
          docker compose --env-file .env.validation -f infra/docker-compose.validation.yml exec -T worker python -m app.deployment --check-db --worker
          docker compose --env-file .env.validation -f infra/docker-compose.validation.yml exec -T api python - <<'PY'
          import httpx, secrets, time
          from http.cookies import SimpleCookie
          from app.config import get_settings
          settings = get_settings()
          # Docker-internal HTTP checks plumbing; public TLS still requires real DNS.
          client = httpx.Client(base_url='http://web:3000', trust_env=False, timeout=30)
          assert client.get('/').status_code == 200
          assert client.get('/api/healthz').json()['mode'] == 'validation'
          body = {'name':'CI pilot','organization_name':'Synthetic CI workspace',
                  'email':'ci-pilot@example.test','password':secrets.token_urlsafe(32)}
          assert client.post('/api/v1/auth/signup',json=body).status_code == 403
          response = client.post('/api/v1/auth/signup',json={**body,'access_code':settings.validation_access_code})
          assert response.status_code == 201
          assert 'Secure' in response.headers['set-cookie'] and 'HttpOnly' in response.headers['set-cookie']
          # Explicit test-only cookie forwarding over the isolated Docker bridge.
          # Public clients must use TLS; no real accounts or recipients are present here.
          cookie = SimpleCookie(); cookie.load(response.headers['set-cookie'])
          client.headers['Cookie'] = 'ai_mos_session=' + cookie['ai_mos_session'].value
          brief = {'name':'Fictional pilot agency','offer':'We build websites for independent shops.',
                   'audience':'Independent shops','objective':'Prepare a fictional controlled campaign',
                   'sample':True,'idempotency_key':secrets.token_hex(16)}
          setup = client.post('/api/v1/setup/start',json=brief)
          assert setup.status_code == 202
          task_id = setup.json()['task']['id']
          for _ in range(60):
              task = client.get('/api/v1/data/tasks/' + task_id).json()
              assert task['status'] not in {'failed','blocked'}
              plan_id = task.get('output',{}).get('plan_id')
              if plan_id:
                  plan = client.get('/api/v1/data/plans/' + plan_id).json()
                  assert plan['status'] != 'blocked'
                  if plan['status'] == 'completed': break
              time.sleep(1)
          else: raise AssertionError('Standalone validation worker did not complete the graph')
          report = client.get('/api/v1/live-validation').json()
          assert not report['production_approved'] and not report['ready_to_begin_core_validation']
          assert report['receipts']['model_completions'] == 0
          assert report['receipts']['sent_messages'] == 0
          print('Controlled validation stack: secure startup, optimized web, private signup and durable sandbox graph passed.')
          PY
          docker compose --env-file .env.validation -f infra/docker-compose.validation.yml run --rm --no-deps proxy caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --validate >/dev/null
      - name: Capture validation service failures
        if: failure()
        run: docker compose --env-file .env.validation -f infra/docker-compose.validation.yml logs --tail=80 api worker web migrate
      - name: Remove disposable validation services
        if: always()
        run: docker compose --env-file .env.validation -f infra/docker-compose.validation.yml down -v

  specification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate specification and validator failure paths
        working-directory: blueprint
        run: |
          npm ci --no-audit --no-fund
          node --test validate.test.js
          node --test postgres-isolation.test.js
          node validate.js
          node verify-scaffold.js

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ai_mos
          POSTGRES_PASSWORD: ai_mos
          POSTGRES_DB: ai_mos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ai_mos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://ai_mos:ai_mos@localhost:5432/ai_mos
      AI_MOS_TEST_ADMIN_URL: postgresql://ai_mos:ai_mos@localhost:5432/ai_mos
      AI_MOS_TEST_PG_BIN: /usr/lib/postgresql/16/bin
      REDIS_URL: redis://localhost:6379/0
      OPENROUTER_API_KEY: ci-placeholder
      TOKEN_ENCRYPTION_KEY: Y2ktcGxhY2Vob2xkZXItMzItYnl0ZXMtbG9uZw==
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then sudo apt-get update && sudo apt-get install -y postgresql-client-16; fi
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Test
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Browser API session boundary regressions
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml config -q
      - name: Build and start sandbox stack
        run: docker compose -f infra/docker-compose.yml up -d --build
      - name: Exercise HTTP workflow and durable worker
        run: python scripts/smoke-http.py
      - name: Capture service failures
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=100
      - name: Stop test stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
