  - {id: AGT-20, name: Learning Agent, tier: T2, ceiling: L2, priority: P2, phase: PH-5,
     tools: [TLS-17, TLS-18]}

# ---------------------------------------------------------------------------
# Tools are the only egress. class determines the gate sequence applied.
# ---------------------------------------------------------------------------
tools:
  - {id: TLS-01, name: search_web, class: read, min_level: L1}
  - {id: TLS-02, name: read_brand_brain, class: read, min_level: L1}
  - {id: TLS-03, name: lookup_company, class: read, min_level: L1}
  - {id: TLS-04, name: score_lead, class: compute, min_level: L1}
  - {id: TLS-05, name: create_lead, class: write, min_level: L2,
     idempotent_on: [organization_id, domain, contact_hash]}
  - {id: TLS-06, name: draft_content, class: write, min_level: L2}
  - {id: TLS-07, name: update_crm, class: write, min_level: L2, field_allowlist: true}
  - {id: TLS-08, name: check_availability, class: read, min_level: L1}
  - {id: TLS-09, name: book_meeting, class: external, min_level: L3,
     requires: [approval, availability_recheck]}
  - {id: TLS-10, name: read_inbox, class: read, min_level: L1}
  - {id: TLS-11, name: classify_reply, class: compute, min_level: L1}
  - {id: TLS-12, name: draft_reply, class: write, min_level: L2}
  - {id: TLS-13, name: create_approval, class: write, min_level: L1}
  - {id: TLS-14, name: send_email, class: external, min_level: L3,
     requires: [approval, suppression_check, consent_check, daily_cap, idempotency]}
  - {id: TLS-15, name: send_bulk_campaign, class: external, min_level: L3,
     requires: [owner_approval, per_message_idempotency, global_cap]}
  - {id: TLS-16, name: create_checkout_link, class: external, min_level: L2,
     requires: [no_payment_inference]}
  - {id: TLS-17, name: read_metrics, class: read, min_level: L1}
  - {id: TLS-18, name: write_learning, class: write, min_level: L2,
     requires: [evidence_ref, effect_size]}

gate_sequence: [schema, permission, policy, budget, approval, idempotency, execute, persist, emit]

# ---------------------------------------------------------------------------
# Model registry. Identifiers and prices below are UNVERIFIED placeholders
# taken from the source brief. Prompt: confirm against the live catalogue and
# stamp verified_at before any promotion. Never inline a model string in code.
# ---------------------------------------------------------------------------
model_registry:
  - {tier: T1, model_id: "z-ai/glm-5.3-flash", status: unverified, use: routine volume,
     price_in_per_mtok: 0.0399, price_out_per_mtok: 0.0784}
  - {tier: T2, model_id: "meta/muse-ember",     status: unverified, use: planning and reasoning,
     price_in_per_mtok: 0.10,   price_out_per_mtok: 0.50}
  - {tier: T3, model_id: "benchmark_required",  status: unverified, use: high impact fallback}
routing:
  resolve_from: [task_class, impact, uncertainty, required_quality, prior_attempts]
  never_resolve_from: [agent_name]
  promotion_requires: [golden_set_pass, cost_per_passing_task, approver, verified_at]

budgets:
  scopes: [task, workflow_run, agent_day, organization_month]
  # Founder-stage defaults. Normal use should land far below the org ceiling;
  # the ceiling exists to stop a runaway loop, not to authorise spending.
  defaults_usd:
    task: 0.02
    workflow_run: 0.50
    agent_day: 0.10
    organization_month: 2.00
  operating_target:
    inference_usd_per_month: 1.00
    note: routine task about $0.0002; 200 leads end to end about $0.10-0.30
  check_before_dispatch: true
  on_breach: block_and_notify
  fail_closed: true

state_machines:
  task: [created, ready, running, awaiting_approval, succeeded, failed, blocked, cancelled, expired]
  lead: [discovered, enriched, scored, qualified, disqualified, contacted, replied,
         meeting_set, converted, dormant, suppressed]
  message: [drafted, pending_approval, queued, sending, sent, delivered, bounced,
            complained, failed]
  campaign: [draft, planned, pending_approval, approved, active, paused, completed,
             cancelled, rejected]
  approval: [pending, approved, rejected, expired, revoked, executed]
  conversation: [new, triaged, drafting, auto_replied, awaiting_human, awaiting_prospect,
                 meeting_offered, closed_won, closed_lost, opted_out]
  meeting: [proposed, confirmed, booked, completed, no_show, cancelled]
  subscription: [trialing, active, past_due, cancelled, expired]

autonomy:
  L1: read and analyse
  L2: create drafts and internal writes
  L3: external effects with approval
  L4: limited pre-authorised effects, off by default, never for money
  always_human: [ad_spend, budget_increase, discount_beyond_limit, bulk_campaign,
                 contract_commitment, price_change, refund, data_deletion, dispute]

approval_matrix:
  send_single_email:   {L1: deny, L2: deny, L3: approve, L4: allow_if_enabled}
  send_bulk_campaign:  {L1: deny, L2: deny, L3: approve, L4: approve}
  book_meeting:        {L1: deny, L2: deny, L3: approve, L4: allow_if_enabled}
  publish_content:     {L1: deny, L2: deny, L3: approve, L4: approve}
  change_ad_spend:     {L1: deny, L2: deny, L3: approve, L4: deny}
  offer_discount:      {L1: deny, L2: deny, L3: approve, L4: deny}
  refund:              {L1: deny, L2: deny, L3: deny, L4: deny}

acceptance_tests:
  - {id: AC-01, name: tenant scoping on create}
  - {id: AC-02, name: tenant isolation every table}
  - {id: AC-03, name: suppression blocks send}
  - {id: AC-04, name: duplicate execution prevented}
  - {id: AC-05, name: approval integrity}
  - {id: AC-06, name: lead deduplication}
  - {id: AC-07, name: budget enforcement}
  - {id: AC-08, name: ledger completeness}
  - {id: AC-09, name: meeting race}
  - {id: AC-10, name: webhook authenticity}
  - {id: AC-11, name: agent permission ceiling}
  - {id: AC-12, name: emergency stop}
  - {id: AC-13, name: restore drill}
  - {id: AC-14, name: claim grounding}

definition_of_done:
  - matches the spec row, entity or endpoint it references
  - boundary validation on user input and provider responses
  - happy path covered by a test named after its AC or task id
  - named failure path covered; failure classified not swallowed
  - tenant scoping verified on every new query or job
  - external effects routed through the tool gateway with an idempotency key
  - cost attributable to org, task, agent and campaign where applicable
  - audit entry for privileged or refused actions
  - logs carry org, task, agent and trace id
  - demonstrated once by a human and recorded

workflows:
  WKF-A:
    name: marketing campaign
    sequence: [intent, research, strategy, content, qa, approval, execute, measure, learn]
  WKF-B:
    name: lead generation
    sequence: [discover, dedupe, enrich, score, save, research, personalise,
               compliance, approval, send, monitor, report]
  WKF-C:
    name: sales conversation
    sequence: [detect, identify, ground, draft, policy_check, send_or_escalate,
               follow_up, offer_meeting]
  WKF-D:
    name: meeting
    sequence: [availability, propose, confirm, recheck, book, remind, update_crm]
  WKF-E:
    name: payment onboarding
    sequence: [checkout, webhook_verify, create_customer, assign_plan, onboard, track_activation]

# ---------------------------------------------------------------------------
# Intent labels — the closed set returned by TLS-11 classify_reply.
# Exactly one primary label per inbound message. Never free text.
# ---------------------------------------------------------------------------
intents:
  labels:
    - {id: interested,        route: reply_draft,        escalate: false, stops_sequence: true}
    - {id: meeting_request,   route: meeting_offer,      escalate: false, stops_sequence: true}
    - {id: pricing_question,  route: human,              escalate: true,  stops_sequence: true}
    - {id: objection,         route: reply_draft_or_human, escalate: true, stops_sequence: true}
    - {id: not_now,           route: follow_up_later,    escalate: false, stops_sequence: true}
    - {id: not_interested,    route: close_lost,         escalate: false, stops_sequence: true}
    - {id: wrong_person,      route: human,              escalate: true,  stops_sequence: true}
    - {id: referral,          route: human,              escalate: true,  stops_sequence: true}
    - {id: unsubscribe,       route: suppress,           escalate: false, stops_sequence: true}
    - {id: complaint,         route: suppress_and_human, escalate: true,  stops_sequence: true}
    - {id: auto_reply,        route: ignore,             escalate: false, stops_sequence: false}
    - {id: bounce_notice,     route: send_path,          escalate: false, stops_sequence: false}
    - {id: vendor_pitch,      route: ignore,             escalate: false, stops_sequence: false}
    - {id: unrelated,         route: human,              escalate: true,  stops_sequence: true}
    - {id: needs_human,       route: human,              escalate: true,  stops_sequence: true}
  rules:
    - exactly one primary label per message; no free text, no multi-label
    - confidence below 0.70 resolves to needs_human regardless of label
    - unsubscribe and complaint write a suppression before any other processing
    - auto_reply and bounce_notice never advance a sequence and never trigger a reply
    - pricing_question, wrong_person, referral and unrelated always reach a human
    - the label set is versioned; changing it requires re-running the reply golden set

# ---------------------------------------------------------------------------
# Event catalogue — the only event names the system may emit.
# Every event carries organization_id, occurred_at, actor_type and actor_id.
# Analytics, the CRM timeline and the weekly digest all read from these names.
# ---------------------------------------------------------------------------
events:
  platform:
    - {name: org.created,          emitter: platform, props: [org_id, plan]}
    - {name: member.invited,       emitter: platform, props: [org_id, email, role]}
    - {name: integration.connected, emitter: platform, props: [provider, account_ref]}
    - {name: integration.expired,  emitter: platform, props: [provider, account_ref]}
    - {name: emergency_stop.set,   emitter: platform, props: [org_id, enabled]}
  knowledge:
    - {name: brand.updated,        emitter: growth_strategy, props: [brand_id, fields]}
    - {name: document.indexed,     emitter: growth_strategy, props: [document_id, chunks]}
  orchestration:
    - {name: command.parsed,       emitter: growth_strategy, props: [command_id, status]}
    - {name: plan.created,         emitter: growth_strategy, props: [plan_id, task_count, cost_estimate]}
    - {name: task.started,         emitter: growth_strategy, props: [task_id, agent_id, type]}
    - {name: task.succeeded,       emitter: growth_strategy, props: [task_id, cost_usd]}
    - {name: task.failed,          emitter: growth_strategy, props: [task_id, error_code]}
    - {name: task.blocked,         emitter: growth_strategy, props: [task_id, reason]}
  approval:
    - {name: approval.requested,   emitter: growth_strategy, props: [approval_id, action_class]}
    - {name: approval.decided,     emitter: growth_strategy, props: [approval_id, decision, decided_by]}
    - {name: approval.expired,     emitter: growth_strategy, props: [approval_id]}
  acquisition:
    - {name: lead.discovered,      emitter: acquisition, props: [lead_id, source, source_confidence]}
    - {name: lead.qualified,       emitter: acquisition, props: [lead_id, campaign_id, score, score_model]}
    - {name: lead.disqualified,    emitter: acquisition, props: [lead_id, score]}
    - {name: lead.suppressed,      emitter: acquisition, props: [lead_id, reason]}
    - {name: message.sent,         emitter: acquisition, props: [message_id, campaign_id, lead_id, provider_id]}
    - {name: message.delivered,    emitter: acquisition, props: [message_id, provider_id]}
    - {name: message.bounced,      emitter: acquisition, props: [message_id, bounce_type]}
    - {name: message.complained,   emitter: acquisition, props: [message_id]}
    - {name: message.replied,      emitter: acquisition, props: [message_id, conversation_id, intent, confidence]}
    - {name: conversation.closed,  emitter: acquisition, props: [conversation_id, outcome]}
  meetings:
    - {name: meeting.proposed,     emitter: acquisition, props: [meeting_id, lead_id, slots]}
    - {name: meeting.booked,       emitter: acquisition, props: [meeting_id, starts_at]}
    - {name: meeting.completed,    emitter: acquisition, props: [meeting_id]}
    - {name: meeting.no_show,      emitter: acquisition, props: [meeting_id]}
  revenue:
    - {name: customer.created,     emitter: revenue, props: [customer_id, lead_id]}
    - {name: subscription.activated, emitter: revenue, props: [subscription_id, plan_code]}
    - {name: subscription.past_due,  emitter: revenue, props: [subscription_id]}
    - {name: subscription.cancelled, emitter: revenue, props: [subscription_id, reason_code]}
    - {name: payment.succeeded,    emitter: revenue, props: [payment_id, amount_minor, currency]}
    - {name: payment.failed,       emitter: revenue, props: [payment_id, error_code]}
  cost:
    - {name: budget.threshold,     emitter: insights, props: [scope, pct_used]}
    - {name: budget.exhausted,     emitter: insights, props: [scope, limit_usd]}
    - {name: model.call.failed,    emitter: ai_gateway, props: [model_id, status, task_id]}
  event_rules:
    - names are entity.past_tense and may not be invented ad hoc
    - emit after commit, never before
    - an event carries ids, counts and enums; never message bodies or personal data
    - the digest and attribution read only from this list
