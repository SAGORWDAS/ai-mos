  - {id: MOD-22, name: Usage and Cost, service: SVC-insights, phase: PH-1,
     entities: [model_usage, budgets]}
  - {id: MOD-23, name: Settings, service: SVC-platform, phase: PH-1,
     entities: [organizations, memberships, invitations]}

# ---------------------------------------------------------------------------
# Agents are manifests executed by one engine. tier = default model tier.
# ceiling = maximum autonomy the role may ever request.
# ---------------------------------------------------------------------------
agents:
